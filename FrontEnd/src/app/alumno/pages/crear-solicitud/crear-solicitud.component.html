<div class="max-w-3xl mx-auto mt-10 p-8 bg-white rounded-2xl shadow-xl border border-gray-100">
    <h2 class="text-2xl font-bold text-gray-800 mb-6 border-b pb-2">
        Crear Solicitud de Práctica
    </h2>

    <div class="space-y-6">
        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">

            <div class="flex flex-col">
                <label class="text-sm font-semibold text-gray-700 mb-1">Nombre Empresa</label>
                <input type="text" [(ngModel)]="empresa.nombre" placeholder="Ej. Tech Solutions S.A."
                    class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 outline-none transition-all" />
            </div>

            <div class="flex flex-col">
                <label class="text-sm font-semibold text-gray-700 mb-1">RUT Empresa</label>
                <input type="text" [(ngModel)]="empresa.rut" placeholder="12.345.678-9"
                    class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 outline-none transition-all" />
            </div>

            <div class="flex flex-col md:col-span-2">
                <label class="text-sm font-semibold text-gray-700 mb-1">Dirección</label>
                <input type="text" [(ngModel)]="empresa.direccion" placeholder="Calle Falsa 123"
                    class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 outline-none transition-all" />
            </div>

            <div class="flex flex-col">
                <label class="text-sm font-semibold text-gray-700 mb-1">Teléfono</label>
                <input type="text" [(ngModel)]="empresa.telefono" placeholder="+56 9..."
                    class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 outline-none transition-all" />
            </div>

            <div class="flex flex-col">
                <label class="text-sm font-semibold text-gray-700 mb-1">Email</label>
                <input type="email" [(ngModel)]="empresa.email" placeholder="contacto@empresa.com"
                    class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 outline-none transition-all" />
            </div>

            <div class="flex flex-col md:col-span-2">
                <label class="text-sm font-semibold text-gray-700 mb-1">Persona de contacto</label>
                <input type="text" [(ngModel)]="empresa.contacto" placeholder="Nombre del encargado"
                    class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 outline-none transition-all" />
            </div>
        </div>

        <div>
            <label class="block text-sm font-semibold text-gray-700 mb-2">Carta de Presentación (PDF/DOC)</label>
            <div class="flex items-center justify-center w-full">
                <label
                    class="flex flex-col items-center justify-center w-full h-32 border-2 border-gray-300 border-dashed rounded-lg cursor-pointer bg-gray-50 hover:bg-gray-100 transition-colors">
                    <div class="flex flex-col items-center justify-center pt-5 pb-6">
                        <svg class="w-8 h-8 mb-3 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                d="M7 16a4 4 0 01-.88-7.903A5 5 0 1115.9 6L16 6a5 5 0 011 9.9M15 13l-3-3m0 0l-3 3m3-3v12" />
                        </svg>
                        <p class="mb-1 text-sm text-gray-500 font-semibold">Haz clic para subir archivo</p>
                        <p class="text-xs text-indigo-600 font-medium" *ngIf="carta">{{ carta.name }}</p>
                        <p class="text-xs text-gray-400" *ngIf="!carta">No hay archivo seleccionado</p>
                    </div>
                    <input type="file" class="hidden" (change)="onFileSelected($event)" />
                </label>
            </div>
        </div>

        <button (click)="crearSolicitud()" [disabled]="!empresa.nombre || !empresa.rut || !carta"
            class="w-full bg-indigo-600 hover:bg-indigo-700 disabled:bg-gray-300 text-white font-bold py-3 px-4 rounded-lg shadow-md transition-all transform active:scale-95 mt-4">
            Enviar Solicitud
        </button>
    </div>
</div>
